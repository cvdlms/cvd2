<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quy Trình</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --accent: #0d9488;
            --accent-2: #10b981;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 88% -10%, color-mix(in srgb, var(--accent) 14%, transparent) 0, transparent 42rem),
                radial-gradient(circle at -5% 110%, color-mix(in srgb, var(--accent-2) 12%, transparent) 0, transparent 40rem),
                linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
            color: var(--ink);
        }
        .masthead { padding: 44rem 64rem 20rem; }
        .kicker { display: flex; align-items: center; gap: 14rem; color: var(--accent); font-weight: 700; font-size: 22rem; letter-spacing: 2.4rem; text-transform: uppercase; margin-bottom: 16rem; }
        .kicker-line { display: inline-block; width: 44rem; height: 4rem; border-radius: 99rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
        .masthead-row { display: flex; align-items: center; justify-content: space-between; gap: 24rem; }
        .masthead-title { font-size: 46rem; font-weight: 800; letter-spacing: -1rem; color: var(--ink); line-height: 1.15; }
        .masthead-badge { flex: none; width: 76rem; height: 76rem; display: grid; place-items: center; font-size: 36rem; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); border-radius: 20rem; box-shadow: var(--shadow-1); }
        .body { flex: 1; overflow: hidden; padding: 26rem 64rem 28rem; }
        .foot { display: flex; align-items: center; justify-content: space-between; padding: 18rem 64rem 22rem; border-top: 1.5rem solid var(--line); color: var(--muted); font-size: 18rem; font-weight: 600; }
        .foot-chip { color: var(--accent); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }

        .flow {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18rem;
        }
        .flow::before {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 50%;
            height: 3rem;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 40%, transparent), transparent);
            border-radius: 99rem;
        }
        .step {
            position: relative;
            z-index: 2;
            flex: 1;
            height: 430rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--paper-2);
            border: 1.5rem solid var(--line);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-1);
            padding: 40rem 26rem 28rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .step:hover { transform: translateY(-6rem); box-shadow: var(--shadow-2); }
        .step-num {
            position: absolute;
            left: 50%;
            top: -30rem;
            transform: translateX(-50%);
            width: 58rem;
            height: 58rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff;
            font-size: 26rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow-1);
            border: 5rem solid var(--paper-2);
        }
        .step-ico { font-size: 34rem; color: var(--accent); margin-bottom: 16rem; }
        .step-title { font-size: 26rem; font-weight: 800; color: var(--ink); margin-bottom: 12rem; }
        .step-desc { font-size: 19rem; color: var(--muted); line-height: 1.5; }
        .arrow {
            flex: none;
            z-index: 3;
            width: 88rem;
            height: 88rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 30rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow-1);
        }
    </style>
</head>
<body>
    <div class="slide">
        <header class="masthead">
            <div class="kicker"><span class="kicker-line"></span><span class="kicker-text">Dạng Visual · Quy Trình</span></div>
            <div class="masthead-row">
                <h1 class="masthead-title">🔄 QUY TRÌNH</h1>
                <div class="masthead-badge"><i class="fas fa-arrow-rotate-right"></i></div>
            </div>
        </header>

        <div class="body">
            <div class="flow">
                <div class="step">
                    <span class="step-num">1</span>
                    <div class="step-ico"><i class="fas fa-play"></i></div>
                    <div class="step-title">Bước 1</div>
                    <div class="step-desc">Mô tả quy trình bước 1</div>
                </div>

                <div class="arrow">→</div>

                <div class="step">
                    <span class="step-num">2</span>
                    <div class="step-ico"><i class="fas fa-gears"></i></div>
                    <div class="step-title">Bước 2</div>
                    <div class="step-desc">Mô tả quy trình bước 2</div>
                </div>

                <div class="arrow">→</div>

                <div class="step">
                    <span class="step-num">3</span>
                    <div class="step-ico"><i class="fas fa-clipboard-check"></i></div>
                    <div class="step-title">Bước 3</div>
                    <div class="step-desc">Mô tả quy trình bước 3</div>
                </div>

                <div class="arrow">→</div>

                <div class="step">
                    <span class="step-num">4</span>
                    <div class="step-ico"><i class="fas fa-flag-checkered"></i></div>
                    <div class="step-title">Hoàn thành</div>
                    <div class="step-desc">Kết quả cuối cùng</div>
                </div>
            </div>
        </div>

        <footer class="foot"><span class="foot-chip">Visual · Quy trình</span><span class="foot-page">04</span></footer>
    </div>
</body>
</html>
