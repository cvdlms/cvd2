<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Đồ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --accent: #0d9488;
            --accent-2: #10b981;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 88% -10%, color-mix(in srgb, var(--accent) 14%, transparent) 0, transparent 42rem),
                radial-gradient(circle at -5% 110%, color-mix(in srgb, var(--accent-2) 12%, transparent) 0, transparent 40rem),
                linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
            color: var(--ink);
        }
        .masthead { padding: 44rem 64rem 20rem; }
        .kicker { display: flex; align-items: center; gap: 14rem; color: var(--accent); font-weight: 700; font-size: 22rem; letter-spacing: 2.4rem; text-transform: uppercase; margin-bottom: 16rem; }
        .kicker-line { display: inline-block; width: 44rem; height: 4rem; border-radius: 99rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
        .masthead-row { display: flex; align-items: center; justify-content: space-between; gap: 24rem; }
        .masthead-title { font-size: 46rem; font-weight: 800; letter-spacing: -1rem; color: var(--ink); line-height: 1.15; }
        .masthead-badge { flex: none; width: 76rem; height: 76rem; display: grid; place-items: center; font-size: 36rem; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); border-radius: 20rem; box-shadow: var(--shadow-1); }
        .body { flex: 1; overflow: hidden; padding: 8rem 64rem 28rem; }
        .foot { display: flex; align-items: center; justify-content: space-between; padding: 16rem 64rem 20rem; border-top: 1.5rem solid var(--line); color: var(--muted); font-size: 22rem; font-weight: 600; }
        .foot-chip { color: var(--accent); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }

        .chart-card {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--paper-2);
            border: 1.5rem solid var(--line);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-1);
            padding: 22rem 26rem 26rem;
        }
        .chart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20rem; margin-bottom: 18rem; }
        .chart-title { display: flex; align-items: center; gap: 14rem; font-size: 23rem; font-weight: 700; color: var(--ink-soft); }
        .legend-dot { flex: none; width: 16rem; height: 16rem; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 0 7rem color-mix(in srgb, var(--accent) 16%, transparent); }
        .chart-chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10rem; }
        .chip { padding: 8rem 18rem; border-radius: 99rem; background: color-mix(in srgb, var(--accent) 10%, #fff); color: var(--accent); font-size: 22rem; font-weight: 700; }
        .chart-stage { flex: 1; position: relative; min-height: 0; }
        .chart-stage canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <div class="slide">
        <header class="masthead">
            <div class="kicker"><span class="kicker-line"></span><span class="kicker-text">Dạng Visual · Biểu Đồ</span></div>
            <div class="masthead-row">
                <h1 class="masthead-title">📈 BIỂU ĐỒ</h1>
                <div class="masthead-badge"><i class="fas fa-chart-column"></i></div>
            </div>
        </header>

        <div class="body">
            <div class="chart-card">
                <div class="chart-toolbar">
                    <div class="chart-title"><span class="legend-dot"></span>Dữ liệu mẫu</div>
                    <div class="chart-chips">
                        <span class="chip">Dạng cột</span>
                        <span class="chip">5 danh mục</span>
                    </div>
                </div>
                <div class="chart-stage">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>

        <footer class="foot"><span class="foot-chip">Visual · Biểu đồ</span><span class="foot-page">01</span></footer>
    </div>

    <script>
        const ctx = document.getElementById('myChart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Danh mục 1', 'Danh mục 2', 'Danh mục 3', 'Danh mục 4', 'Danh mục 5'],
                datasets: [{
                    label: 'Dữ liệu mẫu',
                    data: [65, 59, 80, 81, 56],
                    backgroundColor: [
                        'rgba(102, 126, 234, 0.8)',
                        'rgba(17, 153, 142, 0.8)',
                        'rgba(79, 172, 254, 0.8)',
                        'rgba(250, 112, 154, 0.8)',
                        'rgba(56, 239, 125, 0.8)'
                    ],
                    borderColor: [
                        'rgba(102, 126, 234, 1)',
                        'rgba(17, 153, 142, 1)',
                        'rgba(79, 172, 254, 1)',
                        'rgba(250, 112, 154, 1)',
                        'rgba(56, 239, 125, 1)'
                    ],
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            font: {
                                size: 16
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            font: {
                                size: 16
                            }
                        }
                    },
                    x: {
                        ticks: {
                            font: {
                                size: 16
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
