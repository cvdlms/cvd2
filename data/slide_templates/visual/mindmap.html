<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Tư Duy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --accent: #0d9488;
            --accent-2: #10b981;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 88% -10%, color-mix(in srgb, var(--accent) 14%, transparent) 0, transparent 42rem),
                radial-gradient(circle at -5% 110%, color-mix(in srgb, var(--accent-2) 12%, transparent) 0, transparent 40rem),
                linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
            color: var(--ink);
        }
        .masthead { padding: 44rem 64rem 20rem; }
        .kicker { display: flex; align-items: center; gap: 14rem; color: var(--accent); font-weight: 700; font-size: 22rem; letter-spacing: 2.4rem; text-transform: uppercase; margin-bottom: 16rem; }
        .kicker-line { display: inline-block; width: 44rem; height: 4rem; border-radius: 99rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
        .masthead-row { display: flex; align-items: center; justify-content: space-between; gap: 24rem; }
        .masthead-title { font-size: 46rem; font-weight: 800; letter-spacing: -1rem; color: var(--ink); line-height: 1.15; }
        .masthead-badge { flex: none; width: 76rem; height: 76rem; display: grid; place-items: center; font-size: 36rem; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); border-radius: 20rem; box-shadow: var(--shadow-1); }
        .body { flex: 1; overflow: hidden; padding: 6rem 64rem 26rem; }
        .foot { display: flex; align-items: center; justify-content: space-between; padding: 18rem 64rem 22rem; border-top: 1.5rem solid var(--line); color: var(--muted); font-size: 18rem; font-weight: 600; }
        .foot-chip { color: var(--accent); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }

        .mindmap {
            position: relative;
            height: 100%;
        }
        .mindmap::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 330rem;
            height: 330rem;
            border-radius: 50%;
            border: 2rem dashed color-mix(in srgb, var(--accent) 35%, transparent);
        }
        .mindmap::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 210rem;
            height: 210rem;
            border-radius: 50%;
            background: color-mix(in srgb, var(--accent) 7%, transparent);
        }
        .web {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .branch {
            position: absolute;
            transform: translate(-50%, -50%);
            padding: 18rem 28rem;
            border-radius: 18rem;
            font-size: 21rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            box-shadow: var(--shadow-1);
            z-index: 3;
        }
        .branch-1 { left: 50%; top: 6%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
        .branch-2 { left: 82%; top: 28%; background: linear-gradient(135deg, #0f766e, var(--accent)); }
        .branch-3 { left: 82%; top: 72%; background: linear-gradient(135deg, var(--accent-2), #34d399); }
        .branch-4 { left: 50%; top: 94%; background: linear-gradient(135deg, var(--accent), #2dd4bf); }
        .branch-5 { left: 18%; top: 72%; background: linear-gradient(135deg, #10b981, #5eead4); color: #06251f; }
        .branch-6 { left: 18%; top: 28%; background: linear-gradient(135deg, #ccfbf1, #a7f3d0); color: #06251f; }
        .central-node {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 32rem 48rem;
            border-radius: 26rem;
            font-size: 28rem;
            font-weight: 800;
            letter-spacing: -0.5rem;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow-2);
            z-index: 4;
            white-space: nowrap;
        }
        .central-node::after {
            content: "";
            position: absolute;
            inset: -9rem;
            border-radius: 30rem;
            border: 2rem solid color-mix(in srgb, var(--accent) 40%, transparent);
        }
    </style>
</head>
<body>
    <div class="slide">
        <header class="masthead">
            <div class="kicker"><span class="kicker-line"></span><span class="kicker-text">Dạng Visual · Sơ Đồ Tư Duy</span></div>
            <div class="masthead-row">
                <h1 class="masthead-title">🧠 SƠ ĐỒ TƯ DUY</h1>
                <div class="masthead-badge"><i class="fas fa-diagram-project"></i></div>
            </div>
        </header>

        <div class="body">
            <div class="mindmap">
                <svg class="web" viewBox="0 0 1000 560" preserveAspectRatio="none">
                    <line x1="500" y1="280" x2="500" y2="46" stroke="#0d9488" stroke-opacity="0.35" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                    <line x1="500" y1="280" x2="826" y2="168" stroke="#0d9488" stroke-opacity="0.35" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                    <line x1="500" y1="280" x2="826" y2="392" stroke="#0d9488" stroke-opacity="0.35" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                    <line x1="500" y1="280" x2="500" y2="514" stroke="#0d9488" stroke-opacity="0.35" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                    <line x1="500" y1="280" x2="174" y2="392" stroke="#0d9488" stroke-opacity="0.35" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                    <line x1="500" y1="280" x2="174" y2="168" stroke="#0d9488" stroke-opacity="0.35" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                </svg>

                <div class="branch branch-1">Ý tưởng 1</div>
                <div class="branch branch-2">Ý tưởng 2</div>
                <div class="branch branch-3">Ý tưởng 3</div>
                <div class="branch branch-4">Ý tưởng 4</div>
                <div class="branch branch-5">Ý tưởng 5</div>
                <div class="branch branch-6">Ý tưởng 6</div>

                <div class="central-node">Chủ đề chính</div>
            </div>
        </div>

        <footer class="foot"><span class="foot-chip">Visual · Sơ đồ tư duy</span><span class="foot-page">03</span></footer>
    </div>
</body>
</html>
