<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định Nghĩa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }

        :root {
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }

        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 86% -12%, color-mix(in srgb, var(--accent) 16%, transparent) 0, transparent 44rem),
                radial-gradient(circle at -6% 112%, color-mix(in srgb, var(--accent-2) 13%, transparent) 0, transparent 42rem),
                linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
            color: var(--ink);
        }

        .masthead { padding: 44rem 64rem 18rem; }
        .kicker { display: flex; align-items: center; gap: 14rem; color: var(--accent); font-weight: 700; font-size: 20rem; letter-spacing: 2.4rem; text-transform: uppercase; margin-bottom: 14rem; }
        .kicker-line { display: inline-block; width: 44rem; height: 4rem; border-radius: 99rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
        .masthead-row { display: flex; align-items: center; justify-content: space-between; gap: 24rem; }
        .masthead-title { font-size: 46rem; font-weight: 800; letter-spacing: -1rem; color: var(--ink); line-height: 1.15; }
        .masthead-badge { flex: none; width: 76rem; height: 76rem; display: grid; place-items: center; font-size: 38rem; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); border-radius: 20rem; box-shadow: var(--shadow-1); }

        .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 22rem; padding: 8rem 64rem 20rem; }

        .definition-box {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background:
                radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent-2) 12%, transparent) 0, transparent 34rem),
                linear-gradient(135deg, #ffffff 0%, #f0f2ff 100%);
            border: 1.5rem solid var(--line);
            border-left: 12rem solid var(--accent);
            border-radius: var(--r-lg);
            padding: 34rem 42rem 30rem 44rem;
            box-shadow: var(--shadow-2);
        }
        .definition-box::after {
            content: "❞";
            position: absolute;
            right: 26rem;
            top: -24rem;
            font-size: 190rem;
            font-weight: 900;
            line-height: 1;
            color: color-mix(in srgb, var(--accent) 8%, transparent);
            pointer-events: none;
        }
        .def-label { position: relative; z-index: 1; display: flex; align-items: center; gap: 12rem; color: var(--accent); font-weight: 800; font-size: 19rem; letter-spacing: 2.6rem; text-transform: uppercase; margin-bottom: 16rem; }
        .def-label i { font-size: 21rem; }
        .def-text { position: relative; z-index: 1; font-size: 29rem; line-height: 1.72; color: var(--ink-soft); text-align: justify; }
        .def-text strong { color: var(--accent); font-weight: 800; }

        .note {
            position: relative;
            display: flex;
            gap: 18rem;
            align-items: flex-start;
            background: linear-gradient(135deg, #fffdf6 0%, #fff7e6 100%);
            border: 1.5rem solid #f5d78e;
            border-left: 9rem solid var(--warn);
            border-radius: var(--r-md);
            padding: 20rem 28rem 20rem 32rem;
            box-shadow: var(--shadow-1);
        }
        .note-icon { flex: none; width: 46rem; height: 46rem; border-radius: 13rem; display: grid; place-items: center; background: color-mix(in srgb, var(--warn) 15%, #fff); box-shadow: inset 0 0 0 1.5rem color-mix(in srgb, var(--warn) 22%, #fff); font-size: 22rem; }
        .note-head { font-size: 19rem; font-weight: 800; color: #92400e; letter-spacing: 0.6rem; margin-bottom: 4rem; }
        .note-content { font-size: 19rem; line-height: 1.65; color: #7c5a12; }

        .foot { display: flex; align-items: center; justify-content: space-between; padding: 16rem 64rem 20rem; border-top: 1.5rem solid var(--line); color: var(--muted); font-size: 17rem; font-weight: 600; }
        .foot-chip { color: var(--accent); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }
    </style>
</head>
<body>
    <div class="slide">
        <header class="masthead">
            <div class="kicker"><span class="kicker-line"></span><span class="kicker-text">Giáo Dục · Khái Niệm</span></div>
            <div class="masthead-row">
                <h1 class="masthead-title">Khái Niệm</h1>
                <div class="masthead-badge">📖</div>
            </div>
        </header>

        <main class="body">
            <section class="definition-box">
                <div class="def-label"><i class="fas fa-book-open"></i> Định Nghĩa</div>
                <p class="def-text"><strong>Định nghĩa:</strong> Trình bày định nghĩa chính xác, rõ ràng của khái niệm, thuật ngữ cần giải thích trong bài học.</p>
            </section>

            <aside class="note">
                <div class="note-icon">📌</div>
                <div class="note-text">
                    <div class="note-head">Lưu ý:</div>
                    <div class="note-content">Bổ sung thêm các lưu ý quan trọng, điều kiện áp dụng hoặc những điểm cần chú ý đặc biệt.</div>
                </div>
            </aside>
        </main>

        <footer class="foot">
            <span class="foot-chip">Giáo Dục · Định Nghĩa</span>
            <span class="foot-page">Khái Niệm</span>
        </footer>
    </div>
</body>
</html>
