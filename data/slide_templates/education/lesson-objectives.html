<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Bài Học</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }

        :root {
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }

        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 88% -12%, color-mix(in srgb, var(--accent) 16%, transparent) 0, transparent 46rem),
                radial-gradient(circle at -5% 112%, color-mix(in srgb, var(--accent-2) 13%, transparent) 0, transparent 42rem),
                linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
            color: var(--ink);
        }

        .masthead { padding: 44rem 64rem 18rem; }
        .kicker { display: flex; align-items: center; gap: 14rem; color: var(--accent); font-weight: 700; font-size: 20rem; letter-spacing: 2.4rem; text-transform: uppercase; margin-bottom: 14rem; }
        .kicker-line { display: inline-block; width: 44rem; height: 4rem; border-radius: 99rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
        .masthead-row { display: flex; align-items: center; justify-content: space-between; gap: 24rem; }
        .masthead-title { font-size: 46rem; font-weight: 800; letter-spacing: -1rem; color: var(--ink); line-height: 1.15; }
        .masthead-badge { flex: none; width: 76rem; height: 76rem; display: grid; place-items: center; font-size: 38rem; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); border-radius: 20rem; box-shadow: var(--shadow-1); }

        .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20rem; padding: 8rem 64rem 20rem; }

        .obj-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 1fr;
            gap: 22rem;
        }
        .objective {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14rem;
            background: #ffffff;
            border: 1.5rem solid var(--line);
            border-radius: var(--r-lg);
            padding: 24rem 28rem;
            box-shadow: var(--shadow-1);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .objective:hover {
            transform: translateY(-4rem);
            box-shadow: var(--shadow-2);
            border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
        }
        .objective::after {
            content: "✓";
            position: absolute;
            right: 20rem;
            bottom: -22rem;
            font-size: 120rem;
            font-weight: 900;
            line-height: 1;
            color: color-mix(in srgb, var(--accent) 7%, transparent);
            pointer-events: none;
        }
        .obj-key { font-size: 15rem; letter-spacing: 2.8rem; color: var(--muted); font-weight: 800; text-transform: uppercase; }
        .obj-row { position: relative; z-index: 1; display: flex; gap: 18rem; align-items: center; }
        .obj-icon {
            flex: none;
            width: 64rem;
            height: 64rem;
            border-radius: 18rem;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 26rem;
            box-shadow: 0 12rem 24rem color-mix(in srgb, var(--accent) 32%, transparent);
        }
        .obj-text { font-size: 23rem; line-height: 1.55; color: var(--ink-soft); font-weight: 600; }
        .obj-check {
            position: absolute;
            top: 22rem;
            right: 24rem;
            width: 34rem;
            height: 34rem;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--ok) 13%, #fff);
            color: var(--ok);
            font-size: 15rem;
            box-shadow: inset 0 0 0 1.5rem color-mix(in srgb, var(--ok) 24%, #fff);
        }

        .foot { display: flex; align-items: center; justify-content: space-between; padding: 16rem 64rem 20rem; border-top: 1.5rem solid var(--line); color: var(--muted); font-size: 17rem; font-weight: 600; }
        .foot-chip { color: var(--accent); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }
    </style>
</head>
<body>
    <div class="slide">
        <header class="masthead">
            <div class="kicker"><span class="kicker-line"></span><span class="kicker-text">Giáo Dục · Mục Tiêu</span></div>
            <div class="masthead-row">
                <h1 class="masthead-title">MỤC TIÊU BÀI HỌC</h1>
                <div class="masthead-badge">🎯</div>
            </div>
        </header>

        <main class="body">
            <div class="obj-grid">
                <div class="objective">
                    <div class="obj-key">Mục Tiêu 01</div>
                    <div class="obj-row">
                        <div class="obj-icon"><i class="fas fa-lightbulb"></i></div>
                        <div class="obj-text">Hiểu được khái niệm cơ bản của chủ đề</div>
                    </div>
                    <span class="obj-check"><i class="fas fa-check"></i></span>
                </div>

                <div class="objective">
                    <div class="obj-key">Mục Tiêu 02</div>
                    <div class="obj-row">
                        <div class="obj-icon"><i class="fas fa-book-open"></i></div>
                        <div class="obj-text">Nắm vững các kiến thức trọng tâm</div>
                    </div>
                    <span class="obj-check"><i class="fas fa-check"></i></span>
                </div>

                <div class="objective">
                    <div class="obj-key">Mục Tiêu 03</div>
                    <div class="obj-row">
                        <div class="obj-icon"><i class="fas fa-screwdriver-wrench"></i></div>
                        <div class="obj-text">Vận dụng vào bài tập thực hành</div>
                    </div>
                    <span class="obj-check"><i class="fas fa-check"></i></span>
                </div>

                <div class="objective">
                    <div class="obj-key">Mục Tiêu 04</div>
                    <div class="obj-row">
                        <div class="obj-icon"><i class="fas fa-brain"></i></div>
                        <div class="obj-text">Phát triển tư duy logic và sáng tạo</div>
                    </div>
                    <span class="obj-check"><i class="fas fa-check"></i></span>
                </div>
            </div>
        </main>

        <footer class="foot">
            <span class="foot-chip">Giáo Dục · Mục Tiêu</span>
            <span class="foot-page">4 mục tiêu</span>
        </footer>
    </div>
</body>
</html>
