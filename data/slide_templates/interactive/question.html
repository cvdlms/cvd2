<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu Hỏi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent: #a855f7;
            --accent-2: #ec4899;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent) 45%, transparent) 0, transparent 46rem),
                radial-gradient(circle at 92% 94%, color-mix(in srgb, var(--accent-2) 40%, transparent) 0, transparent 50rem),
                linear-gradient(140deg, #12172b 0%, #0b1020 55%, #12172b 100%);
            color: #fff;
        }
        .ring { position: absolute; border-radius: 50%; border: 2rem solid rgba(255,255,255,0.10); pointer-events: none; }
        .ring-a { width: 560rem; height: 560rem; right: -180rem; top: -200rem; }
        .ring-b { width: 380rem; height: 380rem; left: -120rem; bottom: -140rem; border-color: rgba(255,255,255,0.08); }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 120rem 44rem; gap: 26rem; position: relative; }
        .hero-chip {
            display: flex;
            align-items: center;
            gap: 10rem;
            border: 1.5rem solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.08);
            border-radius: 99rem;
            padding: 10rem 24rem;
            font-size: 22rem;
            font-weight: 600;
            letter-spacing: 2.4rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
        }
        .question-icon {
            width: 130rem;
            height: 130rem;
            display: grid;
            place-items: center;
            font-size: 64rem;
            border-radius: 40rem;
            background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 42%, transparent), color-mix(in srgb, var(--accent-2) 42%, transparent));
            border: 1.5rem solid rgba(255,255,255,0.22);
            box-shadow: 0 0 60rem color-mix(in srgb, var(--accent) 38%, transparent);
            animation: bounce 2s infinite;
            user-select: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20rem); }
        }
        .question-text {
            font-size: 44rem;
            font-weight: 800;
            line-height: 1.45;
            letter-spacing: -1rem;
            max-width: 1080rem;
        }
        .question-text-em {
            background: linear-gradient(100deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .thinking-time {
            display: flex;
            align-items: center;
            gap: 12rem;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            color: #ffffff;
            padding: 16rem 40rem;
            border-radius: 99rem;
            font-size: 22rem;
            font-weight: 700;
            box-shadow: 0 14rem 40rem color-mix(in srgb, var(--accent) 40%, transparent);
        }
        .foot { display: flex; align-items: center; justify-content: space-between; padding: 12rem 64rem 14rem; border-top: 1.5rem solid rgba(255,255,255,0.10); color: rgba(255,255,255,0.5); font-size: 22rem; font-weight: 600; }
        .foot-chip { color: var(--accent); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }
    </style>
</head>
<body>
    <div class="slide">
        <span class="ring ring-a"></span><span class="ring ring-b"></span>

        <div class="hero">
            <div class="hero-chip"><i class="fas fa-brain"></i><span>Câu Hỏi Định Hướng</span></div>
            <div class="question-icon">❓</div>
            <div class="question-text">
                Đặt câu hỏi <span class="question-text-em">kích thích tư duy</span> của học sinh tại đây?
            </div>
            <div class="thinking-time">
                <i class="fas fa-hourglass-half"></i>
                <span>⏱️ Thời gian suy nghĩ: 2 phút</span>
            </div>
        </div>

        <footer class="foot"><span class="foot-chip">Khơi Gợi Suy Nghĩ</span><span class="foot-page">Câu hỏi</span></footer>
    </div>
</body>
</html>
