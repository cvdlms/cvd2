<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu Hỏi Trắc Nghiệm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent: #a855f7;
            --accent-2: #ec4899;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent) 45%, transparent) 0, transparent 46rem),
                radial-gradient(circle at 92% 94%, color-mix(in srgb, var(--accent-2) 40%, transparent) 0, transparent 50rem),
                linear-gradient(140deg, #12172b 0%, #0b1020 55%, #12172b 100%);
            color: #fff;
        }
        .ring { position: absolute; border-radius: 50%; border: 2rem solid rgba(255,255,255,0.10); pointer-events: none; }
        .ring-a { width: 560rem; height: 560rem; right: -180rem; top: -200rem; }
        .ring-b { width: 380rem; height: 380rem; left: -120rem; bottom: -140rem; border-color: rgba(255,255,255,0.08); }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 180rem; gap: 30rem; position: relative; }
        .hero-chip {
            display: flex;
            align-items: center;
            gap: 10rem;
            border: 1.5rem solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.08);
            border-radius: 99rem;
            padding: 10rem 24rem;
            font-size: 18rem;
            font-weight: 600;
            letter-spacing: 2.4rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
        }
        .quiz-header {
            width: 100%;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border: 1.5rem solid rgba(255,255,255,0.14);
            border-radius: 28rem;
            padding: 30rem 40rem;
            box-shadow: 0 14rem 44rem rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6rem);
        }
        .question {
            font-size: 34rem;
            color: #ffffff;
            font-weight: 800;
            line-height: 1.5;
            letter-spacing: -0.8rem;
        }
        .question-icon {
            margin-right: 14rem;
            color: var(--accent);
        }
        .options-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16rem;
        }
        .option {
            display: flex;
            align-items: center;
            position: relative;
            background: rgba(255,255,255,0.06);
            padding: 20rem 30rem;
            margin: 0;
            border-radius: 18rem;
            font-size: 23rem;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            border: 1.5rem solid rgba(255,255,255,0.16);
        }
        .option:hover {
            transform: translateX(10rem);
            border-color: color-mix(in srgb, var(--accent) 55%, rgba(255,255,255,0.3));
            box-shadow: 0 10rem 30rem color-mix(in srgb, var(--accent) 26%, transparent);
        }
        .option::before {
            content: attr(data-option);
            display: inline-block;
            flex: none;
            width: 44rem;
            height: 44rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            text-align: center;
            line-height: 44rem;
            border-radius: 50%;
            margin-right: 22rem;
            font-weight: 800;
            font-size: 20rem;
        }
        .option.correct {
            border-color: color-mix(in srgb, var(--ok) 65%, rgba(255,255,255,0.2));
            background: color-mix(in srgb, var(--ok) 16%, rgba(255,255,255,0.05));
        }
        .option.correct::before {
            background: var(--ok);
            content: "✓";
        }
        .correct-dot {
            margin-left: auto;
            padding-left: 22rem;
            color: var(--ok);
            font-size: 20rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8rem;
        }
        .foot { display: flex; align-items: center; justify-content: space-between; padding: 16rem 64rem 18rem; border-top: 1.5rem solid rgba(255,255,255,0.10); color: rgba(255,255,255,0.5); font-size: 17rem; font-weight: 600; }
        .foot-chip { color: var(--accent); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }
    </style>
</head>
<body>
    <div class="slide">
        <span class="ring ring-a"></span><span class="ring ring-b"></span>

        <div class="hero">
            <div class="hero-chip"><i class="fas fa-trophy"></i><span>Chọn Đáp Án Đúng</span></div>

            <div class="quiz-header">
                <div class="question">
                    <i class="fas fa-question-circle question-icon"></i>Câu hỏi trắc nghiệm của bạn ở đây?
                </div>
            </div>

            <div class="options-container">
                <div class="option" data-option="A">Đáp án A</div>
                <div class="option" data-option="B">Đáp án B</div>
                <div class="option" data-option="C">Đáp án C</div>
                <div class="option correct" data-option="D">Đáp án D (Đúng)<span class="correct-dot"><i class="fas fa-check-circle"></i></span></div>
            </div>
        </div>

        <footer class="foot"><span class="foot-chip">Kiểm Tra Nhanh</span><span class="foot-page">Trắc nghiệm</span></footer>
    </div>
</body>
</html>
