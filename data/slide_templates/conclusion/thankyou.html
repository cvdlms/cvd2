<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm Ơn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #e11d48;
            --accent-2: #f59e0b;
            --ink: #0b1220;
            --ink-soft: #334155;
            --muted: #64748b;
            --paper: #f6f8fc;
            --paper-2: #ffffff;
            --line: #e2e8f0;
            --ok: #16a34a;
            --warn: #d97706;
            --err: #dc2626;
            --r-lg: 24rem;
            --r-md: 16rem;
            --shadow-1: 0 8rem 24rem rgba(15, 23, 42, 0.08);
            --shadow-2: 0 18rem 50rem rgba(15, 23, 42, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: min(calc(100vw / 1366), calc(100vh / 768)); }
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            background: #0d1020;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        }
        .slide {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1366rem;
            height: 768rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent) 45%, transparent) 0, transparent 46rem),
                radial-gradient(circle at 92% 94%, color-mix(in srgb, var(--accent-2) 40%, transparent) 0, transparent 50rem),
                linear-gradient(140deg, #12172b 0%, #0b1020 55%, #12172b 100%);
            color: #fff;
        }
        .ring { position: absolute; border-radius: 50%; border: 2rem solid rgba(255, 255, 255, 0.10); pointer-events: none; }
        .ring-a { width: 560rem; height: 560rem; right: -180rem; top: -200rem; }
        .ring-b { width: 380rem; height: 380rem; left: -120rem; bottom: -140rem; border-color: rgba(255, 255, 255, 0.08); }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40rem 140rem 20rem;
            gap: 24rem;
            z-index: 1;
        }
        .chip {
            border: 1.5rem solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99rem;
            padding: 12rem 26rem;
            font-size: 20rem;
            font-weight: 600;
            letter-spacing: 3rem;
            color: color-mix(in srgb, var(--accent-2) 70%, #fff);
            margin-bottom: 6rem;
        }
        .emoji {
            font-size: 84rem;
            line-height: 1;
            animation: bounce 2.2s ease-in-out infinite;
            filter: drop-shadow(0 14rem 30rem rgba(225, 29, 72, 0.35));
        }
        h1 {
            font-size: 84rem;
            font-weight: 800;
            letter-spacing: -1.5rem;
            line-height: 1.05;
            background: linear-gradient(120deg, #fff 0%, color-mix(in srgb, var(--accent-2) 55%, #fff) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInUp 1s ease both;
        }
        .subtitle {
            font-size: 26rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            animation: fadeInUp 1.2s ease both;
        }
        .message {
            font-size: 22rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.6);
            max-width: 900rem;
            animation: fadeInUp 1.4s ease both;
        }
        .divider {
            width: 120rem;
            height: 4rem;
            border-radius: 99rem;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            margin: 6rem 0 2rem;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30rem); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18rem); }
        }

        .foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20rem 64rem 24rem;
            border-top: 1.5rem solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.55);
            font-size: 17rem;
            font-weight: 600;
            letter-spacing: 1rem;
            z-index: 1;
        }
        .foot-chip { color: var(--accent-2); }
        .foot-page { display: flex; align-items: center; gap: 10rem; }
        .foot-page::before { content: ""; width: 8rem; height: 8rem; border-radius: 50%; background: var(--accent); }

        .confetti {
            position: absolute;
            top: -24rem;
            width: 12rem;
            height: 12rem;
            border-radius: 3rem;
            background: #ffd700;
            animation: confetti-fall 3s linear infinite;
        }
        @keyframes confetti-fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <span class="ring ring-a"></span><span class="ring ring-b"></span>
        <div class="hero">
            <div class="chip">🏁 KẾT THÚC BUỔI HỌC</div>
            <div class="emoji">🙏</div>
            <h1>CẢM ƠN!</h1>
            <div class="divider"></div>
            <div class="subtitle">Cảm ơn các bạn đã tham gia buổi học hôm nay</div>
            <div class="message">
                Chúc các bạn học tốt và thành công!<br>
                Hẹn gặp lại trong buổi học tiếp theo! 🌟
            </div>
        </div>
        <footer class="foot">
            <span class="foot-chip">CẢM ƠN & HẸN GẶP LẠI</span>
            <span class="foot-page">KẾT THÚC</span>
        </footer>
    </div>

    <script>
        // Create confetti effect
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.animationDelay = Math.random() * 3 + 's';
            confetti.style.backgroundColor = ['#FFD700', '#FF6B9D', '#00F2FE', '#38EF7D'][Math.floor(Math.random() * 4)];
            document.body.appendChild(confetti);
        }
    </script>
</body>
</html>
